<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neigra Dashboard</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #121318;
            color: #f0f4f8;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 780px;
            padding: 24px;
            background: #1a1c26;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            margin: 16px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .container::-webkit-scrollbar {
            width: 4px;
        }
        .container::-webkit-scrollbar-thumb {
            background: #2a2d3a;
            border-radius: 4px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #29b6f6, #ff5252);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header .version {
            font-size: 0.7rem;
            color: #4a4f62;
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 16px;
        }

        .profile-color-dot {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
            background: #29b6f6;
        }

        .profile-info {
            flex: 1;
            min-width: 0;
        }

        .profile-info .name {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .profile-info .peer-id {
            font-size: 0.7rem;
            color: #29b6f6;
            font-family: monospace;
            word-break: break-all;
            cursor: pointer;
            user-select: all;
        }

        .profile-info .peer-id-label {
            font-size: 0.6rem;
            color: #4a4f62;
        }

        .profile-info .peer-id:active {
            opacity: 0.7;
        }

        .section-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: #94a3b8;
            margin: 8px 0 8px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .section-title .count {
            font-size: 0.7rem;
            color: #4a4f62;
        }

        .friend-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 6px;
        }

        .friend-item .dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            background: #29b6f6;
        }

        .friend-item .info {
            flex: 1;
            min-width: 0;
        }

        .friend-item .name {
            font-weight: 600;
            font-size: 0.9rem;
            display: block;
        }

        .friend-item .peer-id-small {
            font-size: 0.6rem;
            color: #4a4f62;
            font-family: monospace;
            display: block;
            word-break: break-all;
        }

        .friend-item .action-btn {
            background: #29b6f6;
            color: #032030;
            border: none;
            border-radius: 6px;
            padding: 4px 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .friend-item .action-btn:active {
            transform: scale(0.95);
        }

        .friend-item .action-btn.remove {
            background: transparent;
            color: #ff5252;
            border: 1px solid rgba(255, 82, 82, 0.2);
        }

        .friend-item .action-btn.edit {
            background: transparent;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .search-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .search-row input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 10px 14px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .search-row input:focus {
            border-color: #29b6f6;
        }

        .search-row .btn-search {
            padding: 10px 16px;
            background: #29b6f6;
            color: #032030;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .search-row .btn-search:active {
            transform: scale(0.97);
        }

        .empty-state {
            text-align: center;
            color: #4a4f62;
            font-size: 0.85rem;
            padding: 12px 0;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: #29b6f6;
            color: #032030;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s;
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-danger {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: #ff5252;
            border: 1px solid rgba(255, 82, 82, 0.2);
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            transition: all 0.2s;
        }

        .btn-danger:active {
            background: rgba(255, 82, 82, 0.05);
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1c26;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 20px;
            border-radius: 12px;
            color: #f0f4f8;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 100;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            display: block;
            animation: toastIn 0.3s ease;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .toast.success {
            border-color: #66bb6a;
        }
        .toast.error {
            border-color: #ff5252;
        }
        .toast.info {
            border-color: #29b6f6;
        }

        /* Edit-Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #1a1c26;
            border-radius: 16px;
            padding: 24px;
            max-width: 340px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .modal-box h3 {
            margin-bottom: 12px;
            font-size: 1rem;
        }

        .modal-box input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            margin-bottom: 12px;
        }

        .modal-box input:focus {
            border-color: #29b6f6;
        }

        .modal-box .btn-row {
            display: flex;
            gap: 10px;
        }

        .modal-box .btn-row button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .modal-box .btn-row .save {
            background: #29b6f6;
            color: #032030;
        }

        .modal-box .btn-row .cancel {
            background: rgba(255, 255, 255, 0.06);
            color: #94a3b8;
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 0;
                max-height: none;
                margin: 0;
                padding: 20px;
                height: 100vh;
            }
        }

        @media (min-width: 600px) {
            .container {
                max-width: 460px;
                max-height: 820px;
            }
        }
    </style>
</head>
<body>

    <div id="toast" class="toast"></div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal-overlay">
        <div class="modal-box">
            <h3>✏️ Favorit umbenennen</h3>
            <input type="text" id="edit-name-input" placeholder="Neuer Name...">
            <div class="btn-row">
                <button class="save" id="edit-save-btn">Speichern</button>
                <button class="cancel" id="edit-cancel-btn">Abbrechen</button>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>Neigra</h1>
            <span class="version">v2.4</span>
        </div>

        <!-- PROFILE -->
        <div class="profile-card">
            <div class="profile-color-dot" id="dash-color"></div>
            <div class="profile-info">
                <div class="name" id="dash-name">Spieler</div>
                <div class="peer-id-label">Deine Peer-ID (zum Teilen)</div>
                <div class="peer-id" id="dash-peer-id">Wird geladen...</div>
            </div>
        </div>

        <!-- SEARCH / ADD FAVORITE -->
        <div class="search-row">
            <input type="text" id="friend-search" placeholder="Peer-ID + Name (z.B. neigra-123456)">
            <button class="btn-search" id="search-btn">+ Speichern</button>
        </div>

        <!-- FAVORITEN -->
        <div class="section-title">
            <span>⭐ Favoriten</span>
            <span class="count" id="friend-count">0</span>
        </div>
        <div id="friend-list">
            <div class="empty-state">Noch keine Favoriten. Speichere Gegner-Peer-IDs!</div>
        </div>

        <!-- ACTIONS -->
        <button class="btn-primary" id="start-game-btn">🎮 Spiel starten</button>
        <button class="btn-danger" id="logout-btn">🚪 Abmelden</button>
    </div>

    <script>
        // ================================================================
        // 1. LOCAL STORAGE – USER & FRIENDS
        // ================================================================

        function getCurrentUser() {
            try { return JSON.parse(localStorage.getItem('neigra_current_user')); } catch { return null; }
        }

        function clearCurrentUser() {
            localStorage.removeItem('neigra_current_user');
        }

        function getFriends() {
            try { return JSON.parse(localStorage.getItem('neigra_friends')) || {}; } catch { return {}; }
        }

        function saveFriends(friends) {
            localStorage.setItem('neigra_friends', JSON.stringify(friends));
        }

        function showToast(msg, type = 'info') {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast show ' + type;
            clearTimeout(el._hideTimer);
            el._hideTimer = setTimeout(() => { el.classList.remove('show'); }, 4000);
        }

        // ================================================================
        // 2. PEERJS (NACH OFFIZIELLER DOKUMENTATION)
        // ================================================================

        let peer = null;
        let myPeerId = null;

        function initPeer() {
            // Peer mit zufälliger ID erstellen (oder eigener ID)
            // Laut Dokumentation: new Peer() oder new Peer(id)[reference:2]
            const randomId = 'neigra-' + Math.floor(100000 + Math.random() * 900000).toString();
            peer = new Peer(randomId, {
                config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
            });

            // Laut Dokumentation: peer.on("open", function(id) { ... })[reference:3]
            peer.on('open', function(id) {
                myPeerId = id;
                document.getElementById('dash-peer-id').textContent = id;
                console.log('✅ Meine Peer-ID:', id);
            });

            // Fehlerbehandlung (optional, aber empfohlen)
            peer.on('error', function(err) {
                console.error('PeerJS Fehler:', err);
                // Bei "unavailable ID" – aber wir verwenden zufällige IDs
            });
        }

        // ================================================================
        // 3. DASHBOARD
        // ================================================================

        function loadDashboard() {
            const user = getCurrentUser();
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('dash-name').textContent = user.display_name || user.username;
            document.getElementById('dash-color').style.background = user.preferred_color || '#29b6f6';

            // PeerJS starten
            initPeer();

            renderFriends();
            console.log('✅ Dashboard geladen für:', user.username);
        }

        // ================================================================
        // 4. FRIENDS (FAVORITEN)
        // ================================================================

        function renderFriends() {
            const friends = getFriends();
            const list = document.getElementById('friend-list');
            const count = Object.keys(friends).length;
            document.getElementById('friend-count').textContent = count;

            if (count === 0) {
                list.innerHTML = '<div class="empty-state">Noch keine Favoriten. Speichere Gegner-Peer-IDs!</div>';
                return;
            }

            list.innerHTML = '';
            for (const [id, friend] of Object.entries(friends)) {
                const div = document.createElement('div');
                div.className = 'friend-item';
                div.innerHTML = `
                    <div class="dot" style="background:${friend.color || '#29b6f6'}"></div>
                    <div class="info">
                        <span class="name">${friend.name || 'Unbekannt'}</span>
                        <span class="peer-id-small">${id}</span>
                    </div>
                    <button class="action-btn" onclick="challengeFriend('${id}')">⚔️</button>
                    <button class="action-btn edit" onclick="editFriend('${id}')">✏️</button>
                    <button class="action-btn remove" onclick="removeFriend('${id}')">✖</button>
                `;
                list.appendChild(div);
            }
        }

        function addFriend() {
            const input = document.getElementById('friend-search');
            const value = input.value.trim();

            if (!value) {
                showToast('Bitte Peer-ID und Namen eingeben (z.B. neigra-123456 MeinKumpel)', 'error');
                return;
            }

            // Format: "peer-id Name" oder nur "peer-id"
            let parts = value.split(' ');
            let peerId = parts[0];
            let name = parts.slice(1).join(' ') || 'Gegner';

            // Prüfen ob es wie eine Peer-ID aussieht
            if (!peerId.startsWith('neigra-')) {
                showToast('Die Peer-ID sollte mit "neigra-" beginnen.', 'error');
                return;
            }

            const friends = getFriends();

            if (friends[peerId]) {
                showToast('Dieser Eintrag existiert bereits.', 'error');
                return;
            }

            friends[peerId] = {
                name: name,
                color: '#29b6f6',
                added: new Date().toISOString()
            };

            saveFriends(friends);
            renderFriends();
            input.value = '';
            showToast('✅ Favorit gespeichert!', 'success');
        }

        function removeFriend(id) {
            const friends = getFriends();
            delete friends[id];
            saveFriends(friends);
            renderFriends();
            showToast('Favorit entfernt.', 'info');
        }

        // ===== EDIT FRIEND (Umbenennen) =====
        let editTargetId = null;

        function editFriend(id) {
            const friends = getFriends();
            const friend = friends[id];
            if (!friend) return;

            editTargetId = id;
            document.getElementById('edit-name-input').value = friend.name || '';
            document.getElementById('edit-modal').classList.add('active');
        }

        function saveEdit() {
            const newName = document.getElementById('edit-name-input').value.trim();
            if (!newName) {
                showToast('Bitte einen Namen eingeben.', 'error');
                return;
            }

            const friends = getFriends();
            if (friends[editTargetId]) {
                friends[editTargetId].name = newName;
                saveFriends(friends);
                renderFriends();
                showToast('✅ Name aktualisiert!', 'success');
            }

            closeEditModal();
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.remove('active');
            editTargetId = null;
        }

        // ================================================================
        // 5. CHALLENGE – NACH OFFIZIELLER DOKUMENTATION
        // ================================================================

        function challengeFriend(peerId) {
            if (!peer) {
                showToast('Peer wird noch initialisiert...', 'error');
                return;
            }

            // Laut Dokumentation: peer.connect("dest-peer-id")[reference:4]
            const conn = peer.connect(peerId);

            // conn.on("open") – wenn Verbindung hergestellt[reference:5]
            conn.on('open', function() {
                // Senden der Herausforderung
                const user = getCurrentUser();
                conn.send({
                    type: 'CHALLENGE',
                    from: user?.display_name || 'Ein Spieler',
                    fromId: myPeerId
                });
                showToast('✅ Herausforderung gesendet! Warte auf Antwort...', 'success');

                // Auf Antwort warten
                conn.on('data', function(data) {
                    if (data.type === 'CHALLENGE_ACCEPTED') {
                        showToast('🎉 Gegner hat angenommen! Starte Spiel...', 'success');
                        // Weiterleitung zum Spiel mit der Peer-ID
                        window.location.href = 'game.html?challenge=' + encodeURIComponent(peerId);
                    } else if (data.type === 'CHALLENGE_DECLINED') {
                        showToast('❌ Gegner hat abgelehnt.', 'error');
                        conn.close();
                    }
                });
            });

            // Falls Verbindung fehlschlägt
            conn.on('error', function(err) {
                console.error('Verbindungsfehler:', err);
                showToast('❌ Verbindung fehlgeschlagen. Ist der Gegner online?', 'error');
            });
        }

        // ================================================================
        // 6. AUF CHALLENGES HÖREN (WENN JEMAND UNS HERAUSFORDERT)
        // ================================================================

        // Wird in initPeer() ergänzt
        // Laut Dokumentation: peer.on("connection", function(conn) { ... })[reference:6]
        function setupChallengeListener() {
            if (!peer) return;

            peer.on('connection', function(conn) {
                // conn.on("data") für eingehende Nachrichten[reference:7]
                conn.on('data', function(data) {
                    if (data.type === 'CHALLENGE') {
                        // Herausforderung erhalten
                        const fromName = data.from || 'Unbekannt';
                        const fromId = data.fromId || 'unbekannt';

                        // Dialog anzeigen
                        if (confirm(`${fromName} (${fromId}) fordert dich heraus! Annehmen?`)) {
                            // Annehmen
                            conn.send({
                                type: 'CHALLENGE_ACCEPTED'
                            });
                            showToast('🎉 Du hast angenommen! Starte Spiel...', 'success');
                            window.location.href = 'game.html?challenge=' + encodeURIComponent(fromId);
                        } else {
                            // Ablehnen
                            conn.send({
                                type: 'CHALLENGE_DECLINED'
                            });
                            conn.close();
                            showToast('Herausforderung abgelehnt.', 'info');
                        }
                    }
                });
            });
        }

        // Peer-Initialisierung erweitern
        const originalInitPeer = initPeer;
        initPeer = function() {
            originalInitPeer();
            // Warten bis Peer geöffnet ist, dann Listener setzen
            if (peer) {
                peer.on('open', function() {
                    setupChallengeListener();
                });
            }
        };

        // ================================================================
        // 7. NAVIGATION
        // ================================================================

        function startGame() {
            window.location.href = 'game.html';
        }

        function logout() {
            clearCurrentUser();
            showToast('Abgemeldet. Bis bald!', 'info');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 500);
        }

        // ================================================================
        // 8. EVENT BINDING
        // ================================================================

        document.addEventListener('DOMContentLoaded', function() {
            loadDashboard();

            document.getElementById('start-game-btn').addEventListener('click', startGame);
            document.getElementById('logout-btn').addEventListener('click', logout);
            document.getElementById('search-btn').addEventListener('click', addFriend);

            // Edit-Modal
            document.getElementById('edit-save-btn').addEventListener('click', saveEdit);
            document.getElementById('edit-cancel-btn').addEventListener('click', closeEditModal);

            // Enter-Taste für Suche
            document.getElementById('friend-search').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') addFriend();
            });

            // Enter-Taste für Edit-Modal
            document.getElementById('edit-name-input').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') saveEdit();
            });

            // Klick außerhalb vom Modal schließen
            document.getElementById('edit-modal').addEventListener('click', function(e) {
                if (e.target === this) closeEditModal();
            });
        });

        // ================================================================
        // 9. EXPOSE FUNCTIONS GLOBAL
        // ================================================================

        window.challengeFriend = challengeFriend;
        window.removeFriend = removeFriend;
        window.editFriend = editFriend;
        window.saveEdit = saveEdit;
        window.closeEditModal = closeEditModal;

        console.log('🚀 Neigra v2.4 – Dashboard mit Peer-ID & benennbaren Favoriten');
        console.log('📦 PeerJS nach offizieller Dokumentation implementiert');
    </script>

</body>
</html>
