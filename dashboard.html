<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neigra Dashboard</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #121318;
            color: #f0f4f8;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 780px;
            padding: 20px;
            background: #1a1c26;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            margin: 16px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .container::-webkit-scrollbar {
            width: 4px;
        }
        .container::-webkit-scrollbar-thumb {
            background: #2a2d3a;
            border-radius: 4px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #29b6f6, #ff5252);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header .version {
            font-size: 0.7rem;
            color: #4a4f62;
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 12px;
        }

        .profile-color-dot {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
            background: #29b6f6;
        }

        .profile-info {
            flex: 1;
            min-width: 0;
        }

        .profile-info .name {
            font-size: 1rem;
            font-weight: 700;
        }

        .profile-info .peer-id {
            font-size: 0.65rem;
            color: #29b6f6;
            font-family: monospace;
            word-break: break-all;
            cursor: pointer;
            user-select: all;
            background: rgba(41, 182, 246, 0.08);
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 2px;
        }

        .profile-info .peer-id-label {
            font-size: 0.6rem;
            color: #4a4f62;
        }

        .peer-status {
            font-size: 0.65rem;
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            margin-top: 2px;
        }

        .peer-status.online {
            background: rgba(102, 187, 106, 0.2);
            color: #66bb6a;
        }

        .peer-status.offline {
            background: rgba(148, 163, 184, 0.15);
            color: #6a6f84;
        }

        .peer-status.error {
            background: rgba(255, 82, 82, 0.2);
            color: #ff5252;
        }

        /* ===== ANFRAGEN POSTFACH ===== */
        .section-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: #94a3b8;
            margin: 8px 0 6px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .section-title .count {
            font-size: 0.7rem;
            color: #4a4f62;
            background: rgba(255, 255, 255, 0.06);
            padding: 0 8px;
            border-radius: 10px;
        }

        .request-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(41, 182, 246, 0.06);
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 6px;
            border-left: 3px solid #29b6f6;
        }

        .request-item .info {
            flex: 1;
            min-width: 0;
        }

        .request-item .from {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .request-item .peer-id-small {
            font-size: 0.6rem;
            color: #4a4f62;
            font-family: monospace;
            display: block;
            word-break: break-all;
        }

        .request-item .time {
            font-size: 0.6rem;
            color: #4a4f62;
        }

        .request-item .action-btn {
            padding: 4px 12px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .request-item .action-btn.accept {
            background: #66bb6a;
            color: #032030;
        }

        .request-item .action-btn.decline {
            background: rgba(255, 82, 82, 0.15);
            color: #ff5252;
        }

        .request-item .action-btn:active {
            transform: scale(0.95);
        }

        .empty-state {
            text-align: center;
            color: #4a4f62;
            font-size: 0.85rem;
            padding: 16px 0;
        }

        /* ===== FAVORITEN ===== */
        .friend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 12px;
            border-radius: 10px;
            margin-bottom: 4px;
        }

        .friend-item .dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            flex-shrink: 0;
            background: #29b6f6;
        }

        .friend-item .info {
            flex: 1;
            min-width: 0;
        }

        .friend-item .name {
            font-weight: 600;
            font-size: 0.85rem;
            display: block;
        }

        .friend-item .peer-id-small {
            font-size: 0.55rem;
            color: #4a4f62;
            font-family: monospace;
            display: block;
            word-break: break-all;
        }

        .friend-item .action-btn {
            background: #29b6f6;
            color: #032030;
            border: none;
            border-radius: 6px;
            padding: 3px 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.75rem;
            flex-shrink: 0;
        }

        .friend-item .action-btn:active {
            transform: scale(0.95);
        }

        .friend-item .action-btn.remove {
            background: transparent;
            color: #ff5252;
            border: 1px solid rgba(255, 82, 82, 0.2);
        }

        .friend-item .action-btn.edit {
            background: transparent;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .search-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .search-row input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 8px 12px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
        }

        .search-row input:focus {
            border-color: #29b6f6;
        }

        .search-row .btn-search {
            padding: 8px 14px;
            background: #29b6f6;
            color: #032030;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .search-row .btn-search:active {
            transform: scale(0.97);
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #29b6f6;
            color: #032030;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            transition: all 0.2s;
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-danger {
            width: 100%;
            padding: 10px;
            background: transparent;
            color: #ff5252;
            border: 1px solid rgba(255, 82, 82, 0.2);
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
            transition: all 0.2s;
        }

        .btn-danger:active {
            background: rgba(255, 82, 82, 0.05);
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1c26;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 20px;
            border-radius: 12px;
            color: #f0f4f8;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 100;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            display: block;
            animation: toastIn 0.3s ease;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .toast.success {
            border-color: #66bb6a;
        }
        .toast.error {
            border-color: #ff5252;
        }
        .toast.info {
            border-color: #29b6f6;
        }

        /* Edit Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #1a1c26;
            border-radius: 16px;
            padding: 24px;
            max-width: 340px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .modal-box h3 {
            margin-bottom: 12px;
            font-size: 1rem;
        }

        .modal-box input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            margin-bottom: 12px;
        }

        .modal-box input:focus {
            border-color: #29b6f6;
        }

        .modal-box .btn-row {
            display: flex;
            gap: 10px;
        }

        .modal-box .btn-row button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .modal-box .btn-row .save {
            background: #29b6f6;
            color: #032030;
        }

        .modal-box .btn-row .cancel {
            background: rgba(255, 255, 255, 0.06);
            color: #94a3b8;
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 0;
                max-height: none;
                margin: 0;
                padding: 16px;
                height: 100vh;
            }
        }

        @media (min-width: 600px) {
            .container {
                max-width: 460px;
                max-height: 820px;
            }
        }
    </style>
</head>
<body>

    <div id="toast" class="toast"></div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal-overlay">
        <div class="modal-box">
            <h3>✏️ Favorit umbenennen</h3>
            <input type="text" id="edit-name-input" placeholder="Neuer Name...">
            <div class="btn-row">
                <button class="save" id="edit-save-btn">Speichern</button>
                <button class="cancel" id="edit-cancel-btn">Abbrechen</button>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>Neigra</h1>
            <span class="version">v2.5</span>
        </div>

        <!-- PROFILE -->
        <div class="profile-card">
            <div class="profile-color-dot" id="dash-color"></div>
            <div class="profile-info">
                <div class="name" id="dash-name">Spieler</div>
                <div>
                    <span class="peer-id-label">Deine Peer-ID:</span>
                    <span class="peer-id" id="dash-peer-id">Wird geladen...</span>
                    <span class="peer-status online" id="peer-status">● Online</span>
                </div>
            </div>
        </div>

        <!-- ===== POSTFACH: ANFRAGEN ===== -->
        <div class="section-title">
            <span>📩 Eingehende Anfragen</span>
            <span class="count" id="request-count">0</span>
        </div>
        <div id="request-list">
            <div class="empty-state">Keine ausstehenden Anfragen</div>
        </div>

        <!-- ===== FAVORITEN ===== -->
        <div class="section-title" style="margin-top: 6px;">
            <span>⭐ Favoriten</span>
            <span class="count" id="friend-count">0</span>
        </div>

        <!-- Search / Add -->
        <div class="search-row">
            <input type="text" id="friend-search" placeholder="Peer-ID + Name (z.B. neigra-123456 MeinKumpel)">
            <button class="btn-search" id="search-btn">+ Speichern</button>
        </div>

        <div id="friend-list">
            <div class="empty-state">Noch keine Favoriten</div>
        </div>

        <!-- ACTIONS -->
        <button class="btn-primary" id="start-game-btn">🎮 Spiel starten</button>
        <button class="btn-danger" id="logout-btn">🚪 Abmelden</button>
    </div>

    <script>
        // ================================================================
        // 1. LOCAL STORAGE – USER, FRIENDS & PEER-ID
        // ================================================================

        function getCurrentUser() {
            try { return JSON.parse(localStorage.getItem('neigra_current_user')); } catch { return null; }
        }

        function clearCurrentUser() {
            localStorage.removeItem('neigra_current_user');
        }

        function getFriends() {
            try { return JSON.parse(localStorage.getItem('neigra_friends')) || {}; } catch { return {}; }
        }

        function saveFriends(friends) {
            localStorage.setItem('neigra_friends', JSON.stringify(friends));
        }

        function getStoredPeerId() {
            try { return localStorage.getItem('neigra_peer_id'); } catch { return null; }
        }

        function setStoredPeerId(id) {
            localStorage.setItem('neigra_peer_id', id);
        }

        function showToast(msg, type = 'info') {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast show ' + type;
            clearTimeout(el._hideTimer);
            el._hideTimer = setTimeout(() => { el.classList.remove('show'); }, 4000);
        }

        // ================================================================
        // 2. PEERJS – PERSISTENTE ID + ANFRAGEN EMPFANGEN
        // ================================================================

        let peer = null;
        let myPeerId = null;
        let pendingRequests = [];
        let isPeerReady = false;

        function initPeer() {
            // 1. Gespeicherte ID verwenden oder neue generieren
            let storedId = getStoredPeerId();

            if (!storedId) {
                storedId = 'neigra-' + Math.floor(100000 + Math.random() * 900000).toString();
                setStoredPeerId(storedId);
                console.log('🔑 Neue Peer-ID generiert:', storedId);
            } else {
                console.log('♻️ Gespeicherte Peer-ID geladen:', storedId);
            }

            // 2. Peer mit der ID erstellen
            peer = new Peer(storedId, {
                config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
            });

            // 3. Wenn Peer geöffnet ist
            peer.on('open', function(id) {
                myPeerId = id;
                isPeerReady = true;
                document.getElementById('dash-peer-id').textContent = id;
                document.getElementById('peer-status').textContent = '● Online';
                document.getElementById('peer-status').className = 'peer-status online';
                console.log('✅ Peer ist online mit ID:', id);
                updateStatus();
            });

            // 4. Auf eingehende Verbindungen lauschen (HERAUSFORDERUNGEN EMPFANGEN)
            peer.on('connection', function(conn) {
                console.log('📨 Eingehende Verbindung von:', conn.peer);

                // Auf Daten warten
                conn.on('data', function(data) {
                    if (data.type === 'CHALLENGE') {
                        console.log('⚔️ Herausforderung erhalten von:', data.from, '(' + conn.peer + ')');

                        // Prüfen ob schon eine Anfrage von diesem Peer existiert
                        const existing = pendingRequests.find(r => r.peerId === conn.peer);
                        if (existing) {
                            console.log('⏳ Anfrage bereits vorhanden, ignoriere Duplikat.');
                            return;
                        }

                        // Anfrage speichern
                        const request = {
                            id: 'req_' + Date.now(),
                            peerId: conn.peer,
                            fromName: data.from || 'Unbekannt',
                            fromId: data.fromId || conn.peer,
                            conn: conn,
                            timestamp: new Date().toISOString(),
                            status: 'pending'
                        };

                        pendingRequests.push(request);
                        renderRequests();
                        showToast('📩 Neue Herausforderung von ' + request.fromName + '!', 'info');
                        updateStatus();

                        // Automatisch ablehnen, wenn zu viele Anfragen
                        if (pendingRequests.length > 10) {
                            const oldest = pendingRequests.shift();
                            if (oldest.conn && oldest.conn.open) {
                                oldest.conn.send({ type: 'CHALLENGE_DECLINED', reason: 'Zu viele Anfragen' });
                                oldest.conn.close();
                            }
                        }
                    } else if (data.type === 'CHALLENGE_ACCEPTED') {
                        // Gegner hat angenommen – aber das wird im Game behandelt
                        console.log('✅ Herausforderung angenommen!');
                    } else if (data.type === 'CHALLENGE_DECLINED') {
                        console.log('❌ Herausforderung abgelehnt.');
                        showToast('❌ Gegner hat abgelehnt.', 'error');
                    }
                });

                // Wenn Verbindung geschlossen wird
                conn.on('close', function() {
                    console.log('🔌 Verbindung geschlossen von:', conn.peer);
                    // Anfrage aus Liste entfernen
                    pendingRequests = pendingRequests.filter(r => r.peerId !== conn.peer);
                    renderRequests();
                    updateStatus();
                });

                // Bei Fehlern
                conn.on('error', function(err) {
                    console.error('Verbindungsfehler:', err);
                });
            });

            // 5. Fehlerbehandlung
            peer.on('error', function(err) {
                console.error('❌ Peer-Fehler:', err);
                if (err.type === 'unavailable-id') {
                    // Sollte nicht passieren, da wir die ID selbst verwalten
                    // Aber falls doch, neue ID generieren
                    const newId = 'neigra-' + Math.floor(100000 + Math.random() * 900000).toString();
                    setStoredPeerId(newId);
                    showToast('⚠️ Peer-ID-Konflikt. Neue ID generiert.', 'error');
                    // Peer neu starten
                    if (peer) peer.destroy();
                    setTimeout(initPeer, 1000);
                } else {
                    document.getElementById('peer-status').textContent = '⚠️ Fehler';
                    document.getElementById('peer-status').className = 'peer-status error';
                }
            });

            // 6. Peer-Zustand prüfen (wenn er sich schließt)
            peer.on('close', function() {
                isPeerReady = false;
                document.getElementById('peer-status').textContent = '● Offline';
                document.getElementById('peer-status').className = 'peer-status offline';
                console.log('🔌 Peer geschlossen.');
            });

            // 7. Peer-Zustand prüfen (wenn er sich verbindet)
            peer.on('disconnected', function() {
                isPeerReady = false;
                document.getElementById('peer-status').textContent = '● Verbindung getrennt';
                document.getElementById('peer-status').className = 'peer-status offline';
                console.log('🔌 Peer disconnected. Versuche neu zu verbinden...');
                // Automatisch neu verbinden
                setTimeout(() => {
                    if (peer) peer.reconnect();
                }, 2000);
            });
        }

        // ================================================================
        // 3. ANFRAGEN VERWALTEN (POSTFACH)
        // ================================================================

        function renderRequests() {
            const list = document.getElementById('request-list');
            const count = pendingRequests.length;
            document.getElementById('request-count').textContent = count;

            if (count === 0) {
                list.innerHTML = '<div class="empty-state">Keine ausstehenden Anfragen</div>';
                return;
            }

            list.innerHTML = '';
            // Neueste zuerst anzeigen
            const sorted = [...pendingRequests].reverse();
            sorted.forEach(req => {
                const div = document.createElement('div');
                div.className = 'request-item';
                div.innerHTML = `
                    <div class="info">
                        <span class="from">${req.fromName}</span>
                        <span class="peer-id-small">${req.peerId}</span>
                        <span class="time">${new Date(req.timestamp).toLocaleTimeString()}</span>
                    </div>
                    <button class="action-btn accept" onclick="acceptRequest('${req.id}')">✔ Annehmen</button>
                    <button class="action-btn decline" onclick="declineRequest('${req.id}')">✖ Ablehnen</button>
                `;
                list.appendChild(div);
            });
        }

        function acceptRequest(requestId) {
            const request = pendingRequests.find(r => r.id === requestId);
            if (!request) {
                showToast('Anfrage nicht gefunden.', 'error');
                return;
            }

            // Anfrage aus Liste entfernen
            pendingRequests = pendingRequests.filter(r => r.id !== requestId);
            renderRequests();
            updateStatus();

            // Dem Gegner mitteilen, dass wir annehmen
            try {
                if (request.conn && request.conn.open) {
                    request.conn.send({ type: 'CHALLENGE_ACCEPTED' });
                    showToast('✅ Du hast angenommen! Starte Spiel...', 'success');
                    // Weiterleitung zum Spiel mit der Peer-ID des Gegners
                    window.location.href = 'game.html?challenge=' + encodeURIComponent(request.peerId);
                } else {
                    showToast('❌ Verbindung zum Gegner verloren.', 'error');
                }
            } catch (e) {
                console.error('Fehler beim Annehmen:', e);
                showToast('❌ Fehler beim Annehmen.', 'error');
            }
        }

        function declineRequest(requestId) {
            const request = pendingRequests.find(r => r.id === requestId);
            if (!request) return;

            pendingRequests = pendingRequests.filter(r => r.id !== requestId);
            renderRequests();
            updateStatus();

            try {
                if (request.conn && request.conn.open) {
                    request.conn.send({ type: 'CHALLENGE_DECLINED' });
                    request.conn.close();
                }
            } catch (e) {
                console.error('Fehler beim Ablehnen:', e);
            }
            showToast('Anfrage abgelehnt.', 'info');
        }

        // ================================================================
        // 4. HERAUSFORDERUNG SENDEN (MIT FEHLERBEHANDLUNG)
        // ================================================================

        function challengeFriend(peerId) {
            if (!peer || !isPeerReady) {
                showToast('🔄 Peer wird noch initialisiert...', 'error');
                return;
            }

            if (!peerId || peerId === myPeerId) {
                showToast('❌ Ungültige Peer-ID (du selbst?).', 'error');
                return;
            }

            // Prüfen ob schon eine Anfrage an diesen Peer existiert
            const existing = pendingRequests.find(r => r.peerId === peerId);
            if (existing) {
                showToast('⏳ Es gibt bereits eine Anfrage von/zu diesem Peer.', 'info');
                return;
            }

            showToast('⏳ Verbinde zu ' + peerId + '...', 'info');

            try {
                // Laut Dokumentation: peer.connect(peerId)
                const conn = peer.connect(peerId);

                // Timeout für Verbindung (10 Sekunden)
                let timeoutId = setTimeout(() => {
                    if (conn && conn.open) {
                        // Verbindung ist offen, alles gut
                        return;
                    }
                    showToast('❌ Verbindungs-Timeout. Ist der Gegner online?', 'error');
                    if (conn) conn.close();
                }, 10000);

                conn.on('open', function() {
                    clearTimeout(timeoutId);
                    const user = getCurrentUser();
                    const fromName = user?.display_name || user?.username || 'Ein Spieler';

                    conn.send({
                        type: 'CHALLENGE',
                        from: fromName,
                        fromId: myPeerId
                    });

                    showToast('✅ Herausforderung gesendet! Warte auf Antwort...', 'success');

                    // Auf Antwort warten
                    conn.on('data', function(data) {
                        if (data.type === 'CHALLENGE_ACCEPTED') {
                            showToast('🎉 Gegner hat angenommen! Starte Spiel...', 'success');
                            window.location.href = 'game.html?challenge=' + encodeURIComponent(peerId);
                        } else if (data.type === 'CHALLENGE_DECLINED') {
                            showToast('❌ Gegner hat abgelehnt.', 'error');
                            conn.close();
                        }
                    });

                    conn.on('error', function(err) {
                        console.error('Verbindungsfehler:', err);
                        showToast('❌ Verbindungsfehler. Versuche es später nochmal.', 'error');
                    });

                    conn.on('close', function() {
                        console.log('🔌 Verbindung geschlossen zu:', peerId);
                    });
                });

                conn.on('error', function(err) {
                    clearTimeout(timeoutId);
                    console.error('Verbindungsfehler:', err);
                    showToast('❌ Verbindung fehlgeschlagen. Ist der Gegner online?', 'error');
                });

            } catch (e) {
                console.error('Fehler beim Herausfordern:', e);
                showToast('❌ Fehler: ' + e.message, 'error');
            }
        }

        // ================================================================
        // 5. FAVORITEN VERWALTEN
        // ================================================================

        function renderFriends() {
            const friends = getFriends();
            const list = document.getElementById('friend-list');
            const count = Object.keys(friends).length;
            document.getElementById('friend-count').textContent = count;

            if (count === 0) {
                list.innerHTML = '<div class="empty-state">Keine Favoriten gespeichert</div>';
                return;
            }

            list.innerHTML = '';
            for (const [id, friend] of Object.entries(friends)) {
                const div = document.createElement('div');
                div.className = 'friend-item';
                div.innerHTML = `
                    <div class="dot" style="background:${friend.color || '#29b6f6'}"></div>
                    <div class="info">
                        <span class="name">${friend.name || 'Unbekannt'}</span>
                        <span class="peer-id-small">${id}</span>
                    </div>
                    <button class="action-btn" onclick="challengeFriend('${id}')">⚔️</button>
                    <button class="action-btn edit" onclick="editFriend('${id}')">✏️</button>
                    <button class="action-btn remove" onclick="removeFriend('${id}')">✖</button>
                `;
                list.appendChild(div);
            }
        }

        function addFriend() {
            const input = document.getElementById('friend-search');
            const value = input.value.trim();

            if (!value) {
                showToast('Bitte Peer-ID und Namen eingeben (z.B. neigra-123456 MeinKumpel)', 'error');
                return;
            }

            let parts = value.split(' ');
            let peerId = parts[0];
            let name = parts.slice(1).join(' ') || 'Gegner';

            if (!peerId.startsWith('neigra-')) {
                showToast('Die Peer-ID sollte mit "neigra-" beginnen.', 'error');
                return;
            }

            if (peerId === myPeerId) {
                showToast('Das bist du selbst!', 'error');
                return;
            }

            const friends = getFriends();
            if (friends[peerId]) {
                showToast('Dieser Eintrag existiert bereits.', 'error');
                return;
            }

            friends[peerId] = {
                name: name,
                color: '#29b6f6',
                added: new Date().toISOString()
            };

            saveFriends(friends);
            renderFriends();
            input.value = '';
            showToast('✅ Favorit gespeichert!', 'success');
        }

        function removeFriend(id) {
            const friends = getFriends();
            delete friends[id];
            saveFriends(friends);
            renderFriends();
            showToast('Favorit entfernt.', 'info');
        }

        // ===== EDIT FRIEND =====
        let editTargetId = null;

        function editFriend(id) {
            const friends = getFriends();
            const friend = friends[id];
            if (!friend) return;

            editTargetId = id;
            document.getElementById('edit-name-input').value = friend.name || '';
            document.getElementById('edit-modal').classList.add('active');
        }

        function saveEdit() {
            const newName = document.getElementById('edit-name-input').value.trim();
            if (!newName) {
                showToast('Bitte einen Namen eingeben.', 'error');
                return;
            }

            const friends = getFriends();
            if (friends[editTargetId]) {
                friends[editTargetId].name = newName;
                saveFriends(friends);
                renderFriends();
                showToast('✅ Name aktualisiert!', 'success');
            }

            closeEditModal();
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.remove('active');
            editTargetId = null;
        }

        // ================================================================
        // 6. NAVIGATION & STATUS
        // ================================================================

        function startGame() {
            window.location.href = 'game.html';
        }

        function logout() {
            // Peer sauber schließen
            if (peer) {
                try { peer.destroy(); } catch (e) {}
            }
            clearCurrentUser();
            showToast('Abgemeldet. Bis bald!', 'info');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 500);
        }

        function updateStatus() {
            // Status wird durch Peer-Events aktualisiert
            // Zusätzlich: Anzahl der Anfragen im Title
            const count = pendingRequests.length;
            if (count > 0) {
                document.title = '📩 Neigra (' + count + ' Anfragen)';
            } else {
                document.title = 'Neigra Dashboard';
            }
        }

        // ================================================================
        // 7. DASHBOARD LADEN
        // ================================================================

        function loadDashboard() {
            const user = getCurrentUser();
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('dash-name').textContent = user.display_name || user.username;
            document.getElementById('dash-color').style.background = user.preferred_color || '#29b6f6';

            // Peer starten
            initPeer();

            // Favoriten laden
            renderFriends();

            console.log('✅ Dashboard geladen für:', user.username);
        }

        // ================================================================
        // 8. EVENT BINDING
        // ================================================================

        document.addEventListener('DOMContentLoaded', function() {
            loadDashboard();

            document.getElementById('start-game-btn').addEventListener('click', startGame);
            document.getElementById('logout-btn').addEventListener('click', logout);
            document.getElementById('search-btn').addEventListener('click', addFriend);

            // Edit-Modal
            document.getElementById('edit-save-btn').addEventListener('click', saveEdit);
            document.getElementById('edit-cancel-btn').addEventListener('click', closeEditModal);

            // Enter-Taste für Suche
            document.getElementById('friend-search').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') addFriend();
            });

            // Enter-Taste für Edit-Modal
            document.getElementById('edit-name-input').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') saveEdit();
            });

            // Klick außerhalb vom Modal schließen
            document.getElementById('edit-modal').addEventListener('click', function(e) {
                if (e.target === this) closeEditModal();
            });
        });

        // ================================================================
        // 9. EXPOSE FUNCTIONS GLOBAL
        // ================================================================

        window.challengeFriend = challengeFriend;
        window.removeFriend = removeFriend;
        window.editFriend = editFriend;
        window.saveEdit = saveEdit;
        window.closeEditModal = closeEditModal;
        window.acceptRequest = acceptRequest;
        window.declineRequest = declineRequest;

        console.log('🚀 Neigra v2.5 – Dashboard mit persistenter Peer-ID & Postfach');
        console.log('📦 Peer-ID bleibt im LocalStorage gespeichert');
        console.log('📨 Anfragen werden im Postfach gesammelt');
    </script>

</body>
</html>
