<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neigra Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #121318;
            color: #f0f4f8;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 780px;
            padding: 24px;
            background: #1a1c26;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            margin: 16px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .container::-webkit-scrollbar {
            width: 4px;
        }
        .container::-webkit-scrollbar-thumb {
            background: #2a2d3a;
            border-radius: 4px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #29b6f6, #ff5252);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header .version {
            font-size: 0.7rem;
            color: #4a4f62;
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 16px;
        }

        .profile-color-dot {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
            background: #29b6f6;
        }

        .profile-info {
            flex: 1;
            min-width: 0;
        }

        .profile-info .name {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .profile-info .username {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .section-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: #94a3b8;
            margin: 8px 0 8px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .section-title .count {
            font-size: 0.7rem;
            color: #4a4f62;
        }

        .friend-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 6px;
        }

        .friend-item .dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            background: #29b6f6;
        }

        .friend-item .name {
            flex: 1;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .friend-item .action-btn {
            background: #29b6f6;
            color: #032030;
            border: none;
            border-radius: 6px;
            padding: 4px 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .friend-item .action-btn:active {
            transform: scale(0.95);
        }

        .friend-item .action-btn.remove {
            background: transparent;
            color: #ff5252;
            border: 1px solid rgba(255, 82, 82, 0.2);
        }

        .search-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .search-row input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 10px 14px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .search-row input:focus {
            border-color: #29b6f6;
        }

        .search-row .btn-search {
            padding: 10px 16px;
            background: #29b6f6;
            color: #032030;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .search-row .btn-search:active {
            transform: scale(0.97);
        }

        .empty-state {
            text-align: center;
            color: #4a4f62;
            font-size: 0.85rem;
            padding: 12px 0;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: #29b6f6;
            color: #032030;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s;
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-danger {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: #ff5252;
            border: 1px solid rgba(255, 82, 82, 0.2);
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            transition: all 0.2s;
        }

        .btn-danger:active {
            background: rgba(255, 82, 82, 0.05);
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1c26;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 20px;
            border-radius: 12px;
            color: #f0f4f8;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 100;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            display: block;
            animation: toastIn 0.3s ease;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .toast.success {
            border-color: #66bb6a;
        }
        .toast.error {
            border-color: #ff5252;
        }
        .toast.info {
            border-color: #29b6f6;
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 0;
                max-height: none;
                margin: 0;
                padding: 20px;
                height: 100vh;
            }
        }

        @media (min-width: 600px) {
            .container {
                max-width: 460px;
                max-height: 820px;
            }
        }
    </style>
</head>
<body>

    <div id="toast" class="toast"></div>

    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>Neigra</h1>
            <span class="version">v2.3</span>
        </div>

        <!-- PROFILE -->
        <div class="profile-card">
            <div class="profile-color-dot" id="dash-color"></div>
            <div class="profile-info">
                <div class="name" id="dash-name">Spieler</div>
                <div class="username" id="dash-username">@benutzername</div>
            </div>
        </div>

        <!-- SEARCH -->
        <div class="search-row">
            <input type="text" id="friend-search" placeholder="Peer-ID oder Name speichern...">
            <button class="btn-search" id="search-btn">+ Speichern</button>
        </div>

        <!-- FAVORITEN / FREUNDE -->
        <div class="section-title">
            <span>⭐ Favoriten</span>
            <span class="count" id="friend-count">0</span>
        </div>
        <div id="friend-list">
            <div class="empty-state">Noch keine Favoriten. Speichere Gegner-Peer-IDs!</div>
        </div>

        <!-- ACTIONS -->
        <button class="btn-primary" id="start-game-btn">🎮 Spiel starten</button>
        <button class="btn-danger" id="logout-btn">🚪 Abmelden</button>
    </div>

    <script>
        // ================================================================
        // 1. LOCAL STORAGE – USER & FRIENDS
        // ================================================================

        function getCurrentUser() {
            try { return JSON.parse(localStorage.getItem('neigra_current_user')); } catch { return null; }
        }

        function clearCurrentUser() {
            localStorage.removeItem('neigra_current_user');
        }

        function getFriends() {
            try { return JSON.parse(localStorage.getItem('neigra_friends')) || {}; } catch { return {}; }
        }

        function saveFriends(friends) {
            localStorage.setItem('neigra_friends', JSON.stringify(friends));
        }

        function showToast(msg, type = 'info') {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast show ' + type;
            clearTimeout(el._hideTimer);
            el._hideTimer = setTimeout(() => { el.classList.remove('show'); }, 4000);
        }

        // ================================================================
        // 2. DASHBOARD
        // ================================================================

        function loadDashboard() {
            const user = getCurrentUser();
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('dash-name').textContent = user.display_name || user.username;
            document.getElementById('dash-username').textContent = '@' + user.username;
            document.getElementById('dash-color').style.background = user.preferred_color || '#29b6f6';

            renderFriends();
            console.log('✅ Dashboard geladen für:', user.username);
        }

        // ================================================================
        // 3. FRIENDS (FAVORITEN)
        // ================================================================

        function renderFriends() {
            const friends = getFriends();
            const list = document.getElementById('friend-list');
            const count = Object.keys(friends).length;
            document.getElementById('friend-count').textContent = count;

            if (count === 0) {
                list.innerHTML = '<div class="empty-state">Noch keine Favoriten. Speichere Gegner-Peer-IDs!</div>';
                return;
            }

            list.innerHTML = '';
            for (const [id, friend] of Object.entries(friends)) {
                const div = document.createElement('div');
                div.className = 'friend-item';
                div.innerHTML = `
                    <div class="dot" style="background:${friend.color || '#29b6f6'}"></div>
                    <span class="name">${friend.name || 'Unbekannt'}</span>
                    <span style="font-size:0.65rem;color:#4a4f62;">${id.substring(0, 12)}...</span>
                    <button class="action-btn" onclick="challengeFriend('${id}')">⚔️</button>
                    <button class="action-btn remove" onclick="removeFriend('${id}')">✖</button>
                `;
                list.appendChild(div);
            }
        }

        function addFriend() {
            const input = document.getElementById('friend-search');
            const value = input.value.trim();

            if (!value) {
                showToast('Bitte eine Peer-ID oder einen Namen eingeben.', 'error');
                return;
            }

            // Prüfen ob es eine gültige Peer-ID ist (beginnt mit neigra-)
            // Oder einfach alles erlauben, der User muss wissen was er tut
            const friends = getFriends();

            // Wenn es schon existiert
            if (friends[value]) {
                showToast('Dieser Eintrag existiert bereits.', 'error');
                return;
            }

            // Als Name nehmen wir entweder den eingegebenen Wert oder "Unbekannt"
            // Wenn die Eingabe wie eine Peer-ID aussieht, nehmen wir sie als ID
            let id = value;
            let name = value;

            // Wenn es eine Peer-ID ist (beginnt mit neigra-), nehmen wir sie als ID
            if (value.startsWith('neigra-')) {
                id = value;
                name = 'Gegner';
            } else {
                // Sonst nehmen wir den Wert als Namen und generieren eine ID
                // Aber besser: Der User gibt die Peer-ID ein
                showToast('Bitte gib die Peer-ID ein (beginnt mit neigra-).', 'error');
                return;
            }

            friends[id] = {
                name: name,
                color: '#29b6f6',
                added: new Date().toISOString()
            };

            saveFriends(friends);
            renderFriends();
            input.value = '';
            showToast('✅ Favorit gespeichert!', 'success');
        }

        function removeFriend(id) {
            const friends = getFriends();
            delete friends[id];
            saveFriends(friends);
            renderFriends();
            showToast('Favorit entfernt.', 'info');
        }

        function challengeFriend(id) {
            // Zur game.html weiterleiten mit der Peer-ID als Parameter
            window.location.href = 'game.html?challenge=' + encodeURIComponent(id);
        }

        // ================================================================
        // 4. NAVIGATION
        // ================================================================

        function startGame() {
            window.location.href = 'game.html';
        }

        function logout() {
            clearCurrentUser();
            showToast('Abgemeldet. Bis bald!', 'info');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 500);
        }

        // ================================================================
        // 5. EVENT BINDING
        // ================================================================

        document.addEventListener('DOMContentLoaded', function() {
            loadDashboard();

            document.getElementById('start-game-btn').addEventListener('click', startGame);
            document.getElementById('logout-btn').addEventListener('click', logout);
            document.getElementById('search-btn').addEventListener('click', addFriend);

            // Enter-Taste für Suche
            document.getElementById('friend-search').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') addFriend();
            });
        });

        // ================================================================
        // 6. EXPOSE FUNCTIONS GLOBAL (für onclick)
        // ================================================================

        window.challengeFriend = challengeFriend;
        window.removeFriend = removeFriend;

        console.log('🚀 Neigra v2.3 – Dashboard mit Favoriten-Freunden');
        console.log('📦 PeerJS für Online-Matches, LocalStorage für Freunde');
    </script>

</body>
</html>
