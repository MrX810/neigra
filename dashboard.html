<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neigra Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; touch-action:manipulation; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #121318;
            color: #f0f4f8;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
        }
        .container {
            width: 100%;
            max-width: 420px;
            padding: 32px 24px;
            background: #1a1c26;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            margin: 16px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #29b6f6, #ff5252);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .version { font-size:0.7rem; color:#4a4f62; background:rgba(255,255,255,0.06); padding:4px 10px; border-radius:20px; }
        .profile-card {
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 16px;
        }
        .profile-card .name { font-size:1.4rem; font-weight:700; }
        .profile-card .username { font-size:0.9rem; color:#94a3b8; margin-top:4px; }
        .profile-card .email { font-size:0.8rem; color:#4a4f62; margin-top:2px; }

        /* ===== ONLINE FRIENDS ===== */
        .section-title {
            font-size:0.8rem;
            font-weight:600;
            color:#94a3b8;
            margin:12px 0 8px 0;
            display:flex;
            align-items:center;
            justify-content:space-between;
        }
        .section-title .count {
            font-size:0.7rem;
            color:#4a4f62;
        }
        .friend-item {
            display:flex;
            align-items:center;
            gap:12px;
            background:rgba(255,255,255,0.03);
            padding:10px 14px;
            border-radius:10px;
            margin-bottom:6px;
        }
        .friend-item .dot {
            width:32px;
            height:32px;
            border-radius:50%;
            flex-shrink:0;
            background:#29b6f6;
        }
        .friend-item .name {
            flex:1;
            font-weight:600;
            font-size:0.9rem;
        }
        .friend-item .status {
            font-size:0.65rem;
        }
        .friend-item .status.online { color:#66bb6a; }
        .friend-item .status.offline { color:#4a4f62; }

        .btn-primary {
            width:100%; padding:16px;
            background:#29b6f6; color:#032030;
            border:none; border-radius:12px;
            font-size:1.1rem; font-weight:700;
            cursor:pointer;
            margin-top:8px;
            transition:all 0.2s;
        }
        .btn-primary:active { transform:scale(0.97); }
        .btn-secondary {
            width:100%; padding:14px;
            background:transparent; color:#94a3b8;
            border:1px solid rgba(255,255,255,0.1);
            border-radius:12px;
            font-size:1rem; font-weight:600;
            cursor:pointer;
            margin-top:8px;
            transition:all 0.2s;
        }
        .btn-secondary:active { background:rgba(255,255,255,0.05); }
        .btn-danger {
            width:100%; padding:14px;
            background:transparent; color:#ff5252;
            border:1px solid rgba(255,82,82,0.2);
            border-radius:12px;
            font-size:1rem; font-weight:600;
            cursor:pointer;
            margin-top:8px;
            transition:all 0.2s;
        }
        .btn-danger:active { background:rgba(255,82,82,0.05); }

        .divider {
            display:flex; align-items:center; gap:12px;
            color:#4a4f62; font-size:0.8rem;
            margin:12px 0;
        }
        .divider::before, .divider::after {
            content:''; flex:1; height:1px; background:rgba(255,255,255,0.06);
        }

        .toast {
            position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
            background:#1a1c26; border:1px solid rgba(255,255,255,0.08);
            padding:12px 20px; border-radius:12px;
            color:#f0f4f8; font-size:0.85rem; font-weight:600;
            box-shadow:0 8px 32px rgba(0,0,0,0.5);
            display:none; z-index:100; max-width:90%; text-align:center;
        }
        .toast.show { display:block; animation:toastIn 0.3s ease; }
        @keyframes toastIn {
            from { opacity:0; transform:translateX(-50%) translateY(20px); }
            to { opacity:1; transform:translateX(-50%) translateY(0); }
        }
        .toast.success { border-color:#66bb6a; }
        .toast.error { border-color:#ff5252; }
        .toast.info { border-color:#29b6f6; }

        @media (max-width:480px) {
            .container { border-radius:0; margin:0; padding:20px; height:100vh; display:flex; flex-direction:column; justify-content:center; }
        }
        @media (min-width:600px) { .container { max-width:460px; } }
    </style>
</head>
<body>

    <div id="toast" class="toast"></div>

    <div class="container">
        <div class="header">
            <h1>Neigra</h1>
            <span class="version">v2.3</span>
        </div>

        <div class="profile-card">
            <div class="name" id="dash-name">Spieler</div>
            <div class="username" id="dash-username">@benutzername</div>
            <div class="email" id="dash-email">email@email.de</div>
        </div>

        <!-- ===== ONLINE FRIENDS (AUS PRESENCE) ===== -->
        <div class="section-title">
            <span>👥 Online Freunde</span>
            <span class="count" id="online-count">0</span>
        </div>
        <div id="online-friends-list">
            <div style="text-align:center; color:#4a4f62; font-size:0.85rem; padding:12px 0;">Lade Online-Status...</div>
        </div>

        <button class="btn-primary" id="start-game-btn">🎮 Spiel starten</button>

        <div class="divider">⚙️</div>

        <button class="btn-secondary" id="friends-btn">👥 Freunde verwalten (kommt)</button>
        <button class="btn-danger" id="logout-btn">🚪 Abmelden</button>
    </div>

    <script>
        // ================================================================
        // 1. SUPABASE CLIENT
        // ================================================================
        const SUPABASE_URL = 'https://ynwboxenxfojpdwgygve.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlud2JveGVueGZvanBkd2d5Z3ZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MzkyODEsImV4cCI6MjEwMjExNTI4MX0.L9JnFpu-HrVQW_tzfSqeidbOBEFDPQWWJ7h19-c-C70';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ================================================================
        // 2. LOCAL STORAGE
        // ================================================================

        function getCurrentUser() {
            try { return JSON.parse(localStorage.getItem('neigra_current_user')); } catch { return null; }
        }

        function clearCurrentUser() {
            localStorage.removeItem('neigra_current_user');
        }

        function showToast(msg, type = 'info') {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast show ' + type;
            clearTimeout(el._hideTimer);
            el._hideTimer = setTimeout(() => { el.classList.remove('show'); }, 4000);
        }

        // ================================================================
        // 3. DASHBOARD
        // ================================================================

        let currentUser = null;
        let presenceChannel = null;

        function loadDashboard() {
            const user = getCurrentUser();
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            currentUser = user;
            document.getElementById('dash-name').textContent = user.display_name || user.username;
            document.getElementById('dash-username').textContent = '@' + user.username;
            document.getElementById('dash-email').textContent = user.email || '';

            // Presence starten (nach offizieller Doku)
            initPresence();

            console.log('✅ Dashboard geladen für:', user.username);
        }

        // ================================================================
        // 4. PRESENCE – 1:1 AUS SUPABASE DOKUMENTATION
        // https://supabase.com/docs/guides/realtime/presence
        // ================================================================

        async function initPresence() {
            if (!currentUser) return;

            // 1. Channel mit Presence-Config erstellen (wie in Doku)
            presenceChannel = supabase.channel('online-users', {
                config: {
                    presence: {
                        key: currentUser.id // Eindeutiger Key für diesen User
                    }
                }
            });

            // 2. Auf Presence-Events hören (wie in Doku)
            presenceChannel.on('presence', { event: 'sync' }, () => {
                const state = presenceChannel.presenceState();
                console.log('📡 Presence State:', state);
                updateOnlineFriends(state);
            });

            // 3. Channel subscriben (wie in Doku)
            presenceChannel.subscribe(async (status) => {
                if (status === 'SUBSCRIBED') {
                    // 4. Eigene Presence tracken (wie in Doku)
                    await presenceChannel.track({
                        user_name: currentUser.display_name || currentUser.username,
                        user_id: currentUser.id,
                        online_at: new Date().toISOString()
                    });
                    console.log('✅ Presence tracked für:', currentUser.username);
                }
            });
        }

        // ================================================================
        // 5. ONLINE-FREUNDE ANZEIGEN (AUS PRESENCE STATE)
        // ================================================================

        function updateOnlineFriends(state) {
            const list = document.getElementById('online-friends-list');
            const countEl = document.getElementById('online-count');

            // Eigene ID aus dem State filtern
            const onlineUsers = Object.values(state).filter(presence => {
                // presence ist ein Array von Einträgen
                return presence.some(p => p.user_id !== currentUser.id);
            });

            // Alle eindeutigen User sammeln
            const uniqueUsers = new Map();
            onlineUsers.forEach(presenceArray => {
                presenceArray.forEach(p => {
                    if (p.user_id !== currentUser.id) {
                        uniqueUsers.set(p.user_id, p);
                    }
                });
            });

            const users = Array.from(uniqueUsers.values());
            countEl.textContent = users.length;

            if (users.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:#4a4f62; font-size:0.85rem; padding:12px 0;">Keine Freunde online</div>';
                return;
            }

            list.innerHTML = '';
            users.forEach(user => {
                const div = document.createElement('div');
                div.className = 'friend-item';
                div.innerHTML = `
                    <div class="dot" style="background:#29b6f6;"></div>
                    <span class="name">${user.user_name || 'Unbekannt'}</span>
                    <span class="status online">● Online</span>
                `;
                list.appendChild(div);
            });
        }

        // ================================================================
        // 6. FUNKTIONEN (NUR DAS NÖTIGSTE)
        // ================================================================

        function startGame() {
            window.location.href = 'game.html';
        }

        function logout() {
            // Presence clean verlassen (wie in Doku empfohlen)
            if (presenceChannel) {
                presenceChannel.untrack();
                presenceChannel.unsubscribe();
            }
            clearCurrentUser();
            showToast('Abgemeldet. Bis bald!', 'info');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 500);
        }

        function showFriendsPlaceholder() {
            showToast('👥 Freundesverwaltung kommt in Phase 2.5!', 'info');
        }

        // ================================================================
        // 7. EVENT BINDING
        // ================================================================

        document.addEventListener('DOMContentLoaded', function() {
            loadDashboard();

            document.getElementById('start-game-btn').addEventListener('click', startGame);
            document.getElementById('logout-btn').addEventListener('click', logout);
            document.getElementById('friends-btn').addEventListener('click', showFriendsPlaceholder);
        });

        // ================================================================
        // 8. FALLBACK
        // ================================================================

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            const user = getCurrentUser();
            if (user) {
                document.getElementById('dash-name').textContent = user.display_name || user.username;
                document.getElementById('dash-username').textContent = '@' + user.username;
                document.getElementById('dash-email').textContent = user.email || '';
                initPresence();
            }
            document.getElementById('start-game-btn').addEventListener('click', startGame);
            document.getElementById('logout-btn').addEventListener('click', logout);
            document.getElementById('friends-btn').addEventListener('click', showFriendsPlaceholder);
        }

        console.log('🚀 Neigra v2.3 – Dashboard mit Presence (aus Doku)');
    </script>

</body>
</html>
