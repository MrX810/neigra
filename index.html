<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neigra Login</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #121318;
            color: #f0f4f8;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box {
            width: 100%;
            max-width: 400px;
            padding: 32px 24px;
            background: #1a1c26;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            margin: 16px;
        }
        h1 {
            font-size: 2rem;
            font-weight: 800;
            text-align: center;
            background: linear-gradient(135deg, #29b6f6, #ff5252);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }
        .version { text-align:center; font-size:0.7rem; color:#4a4f62; margin-bottom:20px; }
        .subtitle { text-align:center; color:#94a3b8; font-size:0.9rem; margin-bottom:20px; }
        .form-group { margin-bottom:14px; }
        .form-group label { display:block; font-size:0.8rem; font-weight:600; color:#94a3b8; margin-bottom:4px; }
        .form-group input {
            width:100%; padding:12px 14px;
            background:rgba(0,0,0,0.3);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:10px;
            color:#fff; font-size:1rem;
            outline:none;
        }
        .form-group input:focus { border-color:#29b6f6; }
        .btn-primary {
            width:100%; padding:14px;
            background:#29b6f6; color:#032030;
            border:none; border-radius:10px;
            font-size:1rem; font-weight:700;
            cursor:pointer;
        }
        .btn-primary:active { transform:scale(0.97); }
        .btn-secondary {
            width:100%; padding:12px;
            background:transparent; color:#94a3b8;
            border:1px solid rgba(255,255,255,0.1);
            border-radius:10px;
            font-size:0.9rem; font-weight:600;
            cursor:pointer;
            margin-top:8px;
        }
        .btn-secondary:active { background:rgba(255,255,255,0.05); }
        .divider {
            display:flex; align-items:center; gap:12px;
            color:#4a4f62; font-size:0.8rem;
            margin:12px 0;
        }
        .divider::before, .divider::after {
            content:''; flex:1; height:1px; background:rgba(255,255,255,0.06);
        }
        .error { color:#ff5252; font-size:0.85rem; text-align:center; min-height:24px; padding:4px 0; font-weight:500; }
        .success { color:#66bb6a; font-size:0.85rem; text-align:center; min-height:24px; padding:4px 0; font-weight:500; }
        .hidden { display:none !important; }
        .toast {
            position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
            background:#1a1c26; border:1px solid rgba(255,255,255,0.08);
            padding:12px 20px; border-radius:12px;
            color:#f0f4f8; font-size:0.85rem; font-weight:600;
            box-shadow:0 8px 32px rgba(0,0,0,0.5);
            display:none; z-index:100; max-width:90%; text-align:center;
        }
        .toast.show { display:block; animation:toastIn 0.3s ease; }
        @keyframes toastIn {
            from { opacity:0; transform:translateX(-50%) translateY(20px); }
            to { opacity:1; transform:translateX(-50%) translateY(0); }
        }
        .toast.success { border-color:#66bb6a; }
        .toast.error { border-color:#ff5252; }
        .toast.info { border-color:#29b6f6; }
    </style>
</head>
<body>

    <div id="toast" class="toast"></div>

    <div class="box">
        <h1>Neigra</h1>
        <div class="version">v2.3</div>
        <p class="subtitle" id="auth-subtitle">Melde dich an</p>

        <div id="error-msg" class="error"></div>
        <div id="success-msg" class="success"></div>

        <!-- LOGIN FORM -->
        <div id="login-form">
            <div class="form-group">
                <label for="login-email">E-Mail oder Benutzername</label>
                <input type="text" id="login-email" placeholder="deine@email.de oder Benutzername">
            </div>
            <div class="form-group">
                <label for="login-password">Passwort</label>
                <input type="password" id="login-password" placeholder="••••••••">
            </div>
            <button class="btn-primary" id="login-btn">Anmelden</button>
            <div class="divider">oder</div>
            <button class="btn-secondary" id="show-register-btn">Neuen Account erstellen</button>
        </div>

        <!-- REGISTER FORM -->
        <div id="register-form" class="hidden">
            <div class="form-group">
                <label for="register-username">Benutzername</label>
                <input type="text" id="register-username" placeholder="DeinName" minlength="3" maxlength="20">
            </div>
            <div class="form-group">
                <label for="register-email">E-Mail</label>
                <input type="email" id="register-email" placeholder="deine@email.de">
            </div>
            <div class="form-group">
                <label for="register-password">Passwort (mind. 6 Zeichen)</label>
                <input type="password" id="register-password" placeholder="••••••••" minlength="6">
            </div>
            <button class="btn-primary" id="register-btn">Registrieren</button>
            <div class="divider">oder</div>
            <button class="btn-secondary" id="show-login-btn">Zurück zum Login</button>
        </div>
    </div>

    <script>
        // ================================================================
        // 1. STORAGE
        // ================================================================

        function getUsers() {
            try { return JSON.parse(localStorage.getItem('neigra_users')) || {}; } catch { return {}; }
        }

        function saveUsers(users) {
            localStorage.setItem('neigra_users', JSON.stringify(users));
        }

        function getCurrentUser() {
            try { return JSON.parse(localStorage.getItem('neigra_current_user')); } catch { return null; }
        }

        function setCurrentUser(user) {
            localStorage.setItem('neigra_current_user', JSON.stringify(user));
        }

        function clearCurrentUser() {
            localStorage.removeItem('neigra_current_user');
        }

        // ================================================================
        // 2. UI HELPERS
        // ================================================================

        function showToast(msg, type = 'info') {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast show ' + type;
            clearTimeout(el._hideTimer);
            el._hideTimer = setTimeout(() => { el.classList.remove('show'); }, 4000);
        }

        function setError(msg) {
            document.getElementById('error-msg').textContent = msg;
        }

        function setSuccess(msg) {
            document.getElementById('success-msg').textContent = msg;
        }

        function showLogin() {
            document.getElementById('login-form').classList.remove('hidden');
            document.getElementById('register-form').classList.add('hidden');
            document.getElementById('auth-subtitle').textContent = 'Melde dich an';
            setError('');
            setSuccess('');
        }

        function showRegister() {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('register-form').classList.remove('hidden');
            document.getElementById('auth-subtitle').textContent = 'Account erstellen';
            setError('');
            setSuccess('');
        }

        // ================================================================
        // 3. AUTH LOGIC
        // ================================================================

        function handleLogin() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            setError('');
            setSuccess('');

            if (!email || !password) {
                setError('Bitte E-Mail/Benutzername und Passwort eingeben.');
                return;
            }

            const users = getUsers();
            let foundUser = null;

            for (const key in users) {
                const user = users[key];
                if (user.username === email || user.email === email) {
                    if (user.password === password) {
                        foundUser = user;
                        break;
                    } else {
                        setError('Falsches Passwort.');
                        return;
                    }
                }
            }

            if (!foundUser) {
                setError('Benutzer nicht gefunden.');
                return;
            }

            setCurrentUser(foundUser);
            showToast('Willkommen, ' + foundUser.display_name + '!', 'success');

            // Weiterleitung zum Dashboard
            window.location.href = 'dashboard.html';
        }

        function handleRegister() {
            const username = document.getElementById('register-username').value.trim();
            const email = document.getElementById('register-email').value.trim();
            const password = document.getElementById('register-password').value;

            setError('');
            setSuccess('');

            if (!username || username.length < 3) {
                setError('Benutzername muss mindestens 3 Zeichen haben.');
                return;
            }
            if (!email) {
                setError('Bitte E-Mail eingeben.');
                return;
            }
            if (!password || password.length < 6) {
                setError('Passwort muss mindestens 6 Zeichen haben.');
                return;
            }

            const users = getUsers();

            for (const key in users) {
                if (users[key].username === username) {
                    setError('Benutzername ist bereits vergeben.');
                    return;
                }
                if (users[key].email === email) {
                    setError('E-Mail ist bereits registriert.');
                    return;
                }
            }

            const userId = 'user_' + Date.now();
            users[userId] = {
                id: userId,
                username: username,
                email: email,
                password: password,
                display_name: username,
                preferred_color: '#29b6f6',
                is_admin: false,
                created_at: new Date().toISOString()
            };

            saveUsers(users);

            setSuccess('✅ Account erstellt! Du kannst dich jetzt anmelden.');

            setTimeout(() => {
                showLogin();
                document.getElementById('login-email').value = email;
                setSuccess('✅ Account erstellt! Melde dich jetzt an.');
            }, 1500);
        }

        // ================================================================
        // 4. SESSION CHECK
        // ================================================================

        function checkSession() {
            const user = getCurrentUser();
            if (user) {
                window.location.href = 'dashboard.html';
            }
        }

        // ================================================================
        // 5. EVENT BINDING
        // ================================================================

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('login-btn').addEventListener('click', handleLogin);
            document.getElementById('register-btn').addEventListener('click', handleRegister);
            document.getElementById('show-register-btn').addEventListener('click', showRegister);
            document.getElementById('show-login-btn').addEventListener('click', showLogin);

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    const loginVisible = !document.getElementById('login-form').classList.contains('hidden');
                    if (loginVisible) handleLogin();
                    else handleRegister();
                }
            });

            checkSession();
        });

        console.log('🚀 Neigra v2.3 – Login');
    </script>

</body>
</html>
