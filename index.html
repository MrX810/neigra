<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neigra v2.1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #121318;
            color: #f0f4f8;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 24px;
            background: #1a1c26;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            margin: 16px;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            text-align: center;
            background: linear-gradient(135deg, #29b6f6, #ff5252);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .version {
            text-align: center;
            font-size: 0.7rem;
            color: #4a4f62;
            margin-bottom: 20px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #29b6f6;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: #29b6f6;
            color: #032030;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .btn-secondary:active {
            background: rgba(255, 255, 255, 0.05);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #4a4f62;
            font-size: 0.8rem;
            margin: 12px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.06);
        }

        .error {
            color: #ff5252;
            font-size: 0.85rem;
            text-align: center;
            min-height: 24px;
            padding: 4px 0;
            font-weight: 500;
        }

        .success {
            color: #66bb6a;
            font-size: 0.85rem;
            text-align: center;
            min-height: 24px;
            padding: 4px 0;
            font-weight: 500;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1c26;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 20px;
            border-radius: 12px;
            color: #f0f4f8;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 100;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            display: block;
            animation: toastIn 0.3s ease;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .toast.success {
            border-color: #66bb6a;
        }
        .toast.error {
            border-color: #ff5252;
        }
        .toast.info {
            border-color: #29b6f6;
        }

        .dashboard {
            text-align: center;
        }

        .dashboard .user-info {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .dashboard .user-info .name {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .dashboard .user-info .email {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .dashboard .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 16px;
        }

        .dashboard .actions .btn-dash {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 14px 10px;
            color: #f0f4f8;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .dashboard .actions .btn-dash:active {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(0.97);
        }

        .dashboard .actions .btn-dash .icon {
            font-size: 1.4rem;
            display: block;
            margin-bottom: 4px;
        }

        .dashboard .actions .btn-dash.danger {
            border-color: rgba(255, 82, 82, 0.2);
            color: #ff5252;
        }

        .dashboard .actions .btn-dash.primary {
            background: #29b6f6;
            color: #032030;
            border-color: #29b6f6;
        }
    </style>
</head>
<body>

    <div id="toast" class="toast"></div>

    <!-- ===== LOGIN ===== -->
    <div id="login-container" class="container">
        <h1>Neigra</h1>
        <div class="version">v2.1</div>
        <p class="subtitle">Melde dich an</p>

        <div id="login-error" class="error"></div>
        <div id="login-success" class="success"></div>

        <div class="form-group">
            <label for="login-email">E-Mail oder Benutzername</label>
            <input type="text" id="login-email" placeholder="deine@email.de oder Benutzername" autocomplete="username">
        </div>

        <div class="form-group">
            <label for="login-password">Passwort</label>
            <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
        </div>

        <button class="btn-primary" onclick="handleLogin()">Anmelden</button>

        <div class="divider">oder</div>

        <button class="btn-secondary" onclick="showScreen('register')">Neuen Account erstellen</button>
    </div>

    <!-- ===== REGISTER ===== -->
    <div id="register-container" class="container hidden">
        <h1>Neigra</h1>
        <div class="version">v2.1</div>
        <p class="subtitle">Account erstellen</p>

        <div id="register-error" class="error"></div>
        <div id="register-success" class="success"></div>

        <div class="form-group">
            <label for="register-username">Benutzername</label>
            <input type="text" id="register-username" placeholder="DeinName" autocomplete="username" minlength="3" maxlength="20">
        </div>

        <div class="form-group">
            <label for="register-email">E-Mail</label>
            <input type="email" id="register-email" placeholder="deine@email.de" autocomplete="email">
        </div>

        <div class="form-group">
            <label for="register-password">Passwort (mind. 6 Zeichen)</label>
            <input type="password" id="register-password" placeholder="••••••••" autocomplete="new-password" minlength="6">
        </div>

        <button class="btn-primary" onclick="handleRegister()">Registrieren</button>

        <div class="divider">oder</div>

        <button class="btn-secondary" onclick="showScreen('login')">Zurück zum Login</button>
    </div>

    <!-- ===== DASHBOARD ===== -->
    <div id="dashboard-container" class="container hidden">
        <h1>Neigra</h1>
        <div class="version">v2.1</div>

        <div class="dashboard">
            <div class="user-info">
                <div class="name" id="dash-name">Spieler</div>
                <div class="email" id="dash-email">email@email.de</div>
            </div>

            <div class="actions">
                <div class="btn-dash" onclick="showToast('Profil kommt später', 'info')">
                    <span class="icon">👤</span>
                    Profil
                </div>
                <div class="btn-dash" onclick="showToast('Freunde kommen später', 'info')">
                    <span class="icon">👥</span>
                    Freunde
                </div>
                <div class="btn-dash primary" onclick="showToast('Match-System kommt später', 'info')">
                    <span class="icon">⚔️</span>
                    Herausfordern
                </div>
                <div class="btn-dash danger" onclick="handleLogout()">
                    <span class="icon">🚪</span>
                    Logout
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        // 1. LOCAL STORAGE USER SYSTEM – KEIN SUPABASE AUTH
        // ================================================================

        function getUsers() {
            try {
                return JSON.parse(localStorage.getItem('neigra_users')) || {};
            } catch {
                return {};
            }
        }

        function saveUsers(users) {
            localStorage.setItem('neigra_users', JSON.stringify(users));
        }

        function getCurrentUser() {
            try {
                return JSON.parse(localStorage.getItem('neigra_current_user'));
            } catch {
                return null;
            }
        }

        function setCurrentUser(user) {
            localStorage.setItem('neigra_current_user', JSON.stringify(user));
        }

        function clearCurrentUser() {
            localStorage.removeItem('neigra_current_user');
        }

        // ================================================================
        // 2. UI HELPERS
        // ================================================================

        function showScreen(screen) {
            document.getElementById('login-container').classList.add('hidden');
            document.getElementById('register-container').classList.add('hidden');
            document.getElementById('dashboard-container').classList.add('hidden');

            if (screen === 'login') {
                document.getElementById('login-container').classList.remove('hidden');
            } else if (screen === 'register') {
                document.getElementById('register-container').classList.remove('hidden');
            } else if (screen === 'dashboard') {
                document.getElementById('dashboard-container').classList.remove('hidden');
                updateDashboard();
            }
        }

        function showToast(msg, type = 'info') {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast show ' + type;
            clearTimeout(el._hideTimer);
            el._hideTimer = setTimeout(() => {
                el.classList.remove('show');
            }, 4000);
        }

        function setLoginError(msg) {
            document.getElementById('login-error').textContent = msg;
        }

        function setLoginSuccess(msg) {
            document.getElementById('login-success').textContent = msg;
        }

        function setRegisterError(msg) {
            document.getElementById('register-error').textContent = msg;
        }

        function setRegisterSuccess(msg) {
            document.getElementById('register-success').textContent = msg;
        }

        // ================================================================
        // 3. AUTH
        // ================================================================

        function handleLogin() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            setLoginError('');
            setLoginSuccess('');

            if (!email || !password) {
                setLoginError('Bitte E-Mail/Benutzername und Passwort eingeben.');
                return;
            }

            const users = getUsers();
            let foundUser = null;

            // Suche nach Benutzername oder E-Mail
            for (const key in users) {
                const user = users[key];
                if (user.username === email || user.email === email) {
                    if (user.password === password) {
                        foundUser = user;
                        break;
                    } else {
                        setLoginError('Falsches Passwort.');
                        return;
                    }
                }
            }

            if (!foundUser) {
                setLoginError('Benutzer nicht gefunden.');
                return;
            }

            // Erfolg
            setCurrentUser(foundUser);
            showScreen('dashboard');
            showToast('Willkommen, ' + foundUser.display_name + '!', 'success');
        }

        function handleRegister() {
            const username = document.getElementById('register-username').value.trim();
            const email = document.getElementById('register-email').value.trim();
            const password = document.getElementById('register-password').value;

            setRegisterError('');
            setRegisterSuccess('');

            if (!username || username.length < 3) {
                setRegisterError('Benutzername muss mindestens 3 Zeichen haben.');
                return;
            }
            if (!email) {
                setRegisterError('Bitte E-Mail eingeben.');
                return;
            }
            if (!password || password.length < 6) {
                setRegisterError('Passwort muss mindestens 6 Zeichen haben.');
                return;
            }

            const users = getUsers();

            // Prüfen ob Benutzername oder E-Mail schon existiert
            for (const key in users) {
                if (users[key].username === username) {
                    setRegisterError('Benutzername ist bereits vergeben.');
                    return;
                }
                if (users[key].email === email) {
                    setRegisterError('E-Mail ist bereits registriert.');
                    return;
                }
            }

            // Neuen User anlegen
            const userId = 'user_' + Date.now();
            users[userId] = {
                id: userId,
                username: username,
                email: email,
                password: password, // ⚠️ In Produktion hashen! Nur für Test.
                display_name: username,
                preferred_color: '#29b6f6',
                is_admin: false,
                created_at: new Date().toISOString()
            };

            saveUsers(users);

            setRegisterSuccess('✅ Account erstellt! Du kannst dich jetzt anmelden.');

            // Nach 1.5 Sekunden zum Login wechseln
            setTimeout(() => {
                showScreen('login');
                document.getElementById('login-email').value = email;
                setLoginSuccess('✅ Account erstellt! Melde dich jetzt an.');
            }, 1500);
        }

        function handleLogout() {
            clearCurrentUser();
            showScreen('login');
            showToast('Abgemeldet. Bis bald!', 'info');
        }

        // ================================================================
        // 4. DASHBOARD
        // ================================================================

        function updateDashboard() {
            const user = getCurrentUser();
            if (!user) {
                showScreen('login');
                return;
            }

            document.getElementById('dash-name').textContent = user.display_name || user.username;
            document.getElementById('dash-email').textContent = user.email || '';
        }

        // ================================================================
        // 5. SESSION CHECK
        // ================================================================

        function checkSession() {
            const user = getCurrentUser();
            if (user) {
                showScreen('dashboard');
            } else {
                showScreen('login');
            }
        }

        // ================================================================
        // 6. KEYBOARD SUPPORT
        // ================================================================

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const loginVisible = !document.getElementById('login-container').classList.contains('hidden');
                const registerVisible = !document.getElementById('register-container').classList.contains('hidden');

                if (loginVisible) handleLogin();
                else if (registerVisible) handleRegister();
            }
        });

        // ================================================================
        // 7. START
        // ================================================================

        checkSession();

        console.log('🚀 Neigra v2.1 – Login mit LocalStorage (kein Supabase Auth)');
        console.log('📦 Account-Daten werden im Browser gespeichert.');
        console.log('📦 Für später: Supabase als echte Datenbank nutzen!');
    </script>

</body>
</html>
